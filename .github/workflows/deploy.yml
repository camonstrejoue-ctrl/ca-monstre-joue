name: Déployer le site

on:
  # Chaque push sur main republie automatiquement le site (en plus du
  # déclenchement manuel via Settings > Actions > ce workflow > "Run
  # workflow"). Sans effet tant que GitHub Pages n'est pas activé dans les
  # paramètres du dépôt (Settings > Pages) — ce déclencheur reste inerte
  # jusque-là, il ne spamme rien.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer data/content.json depuis js/data.js
        run: node scripts/export-data.js

      - name: Générer les pages SEO par jeu/article/catégorie + sitemap.xml
        run: node scripts/generate-seo-pages.js

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact (site + data/content.json)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
