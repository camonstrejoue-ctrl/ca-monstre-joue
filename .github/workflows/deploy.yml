name: Déployer le site

on:
  # Chaque push sur main republie automatiquement le site (en plus du
  # déclenchement manuel via Settings > Actions > ce workflow > "Run
  # workflow"). Sans effet tant que GitHub Pages n'est pas activé dans les
  # paramètres du dépôt (Settings > Pages) — ce déclencheur reste inerte
  # jusque-là, il ne spamme rien.
  push:
    branches: [main]
  # Redéploiement quotidien (04:00 UTC = 6h en été, 5h en hiver en Suisse)
  # pour qu'un article programmé (champ `date` dans le futur) entre dans
  # sitemap.xml, llms.txt et feed.xml le jour de sa publication, même sans
  # push ce jour-là. Le masquage côté navigateur, lui, se fait déjà seul.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer data/content.json depuis js/data.js
        run: node scripts/export-data.js

      - name: Générer les pages SEO par jeu/article/catégorie + sitemap.xml
        run: node scripts/generate-seo-pages.js

      # Liste blanche : seuls les fichiers dont le site public a besoin partent
      # en ligne. Avant (path: .), tout le dépôt était servi sur
      # camonstrejoue.ch : notes internes (docs/, CLAUDE.md, social/), code de
      # l'app (app/), skills (.claude/) et brouillons du Hub (js/hub-seed.json).
      # Le Hub vit sur Firebase Hosting (scripts/build-hub-dist.js), pas ici.
      # Toute page .html ajoutée à la racine est publiée d'office ; un NOUVEAU
      # dossier public (autre que ceux listés ci-dessous) doit être ajouté ici.
      - name: Assembler le site public (liste blanche)
        run: |
          set -euo pipefail
          mkdir _site
          cp *.html _site/
          cp -r assets css js data jeu article categorie .well-known _site/
          cp CNAME robots.txt sitemap.xml llms.txt feed.xml _site/
          rm _site/hub.html _site/css/hub.css _site/js/hub.js _site/js/hub-seed.json

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact (site public assemblé)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
